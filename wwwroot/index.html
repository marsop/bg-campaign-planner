<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Game Campaign Planner | Gloomhaven & Pandemic Season 0</title>
    <base href="/" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">

    <!-- Bootstrap & Bootstrap Icons -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="bg-campaign-planner.styles.css" rel="stylesheet" />

    <!-- Instant Theme Loader (Prevents theme flashing) -->
    <script type="text/javascript">
        (function() {
            var stored = localStorage.getItem('bg_campaign_planner_theme');
            var isDark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || (stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var theme = isDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>

    <!-- GitHub Pages Single Page App Base Href Fix -->
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
</head>

<body>
    <div id="app">
        <div class="initial-loader">
            <div class="loader-emblem">🎲</div>
            <div class="loading-title">Loading Campaign Planner...</div>
            <div class="spinner-border text-warning mt-3" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <!-- App Helpers & Theme Interop -->
    <script>
        window.campaignPlannerTheme = {
            getStoredTheme: function () {
                return localStorage.getItem('bg_campaign_planner_theme') || 'system';
            },
            applyTheme: function (themeMode) {
                localStorage.setItem('bg_campaign_planner_theme', themeMode);
                var resolved = 'dark';
                if (themeMode === 'light') {
                    resolved = 'light';
                } else if (themeMode === 'dark') {
                    resolved = 'dark';
                } else {
                    // System mode
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                        resolved = 'light';
                    } else {
                        resolved = 'dark';
                    }
                }
                document.documentElement.setAttribute('data-theme', resolved);
                document.documentElement.setAttribute('data-bs-theme', resolved);
                return resolved;
            },
            listenToSystemThemeChanges: function (dotNetRef) {
                if (window.matchMedia) {
                    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
                        var stored = localStorage.getItem('bg_campaign_planner_theme');
                        if (!stored || stored === 'system') {
                            var newTheme = e.matches ? 'dark' : 'light';
                            document.documentElement.setAttribute('data-theme', newTheme);
                            document.documentElement.setAttribute('data-bs-theme', newTheme);
                            dotNetRef.invokeMethodAsync('OnSystemThemeChanged', newTheme);
                        }
                    });
                }
            }
        };

        window.campaignPlanner = {
            downloadFile: function (filename, contentType, content) {
                const blob = new Blob([content], { type: contentType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            },
            copyToClipboard: async function (text) {
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                }
            },
            getSavedLanguage: function () {
                try {
                    return localStorage.getItem('bg_campaign_planner_lang');
                } catch (e) {
                    return null;
                }
            },
            setSavedLanguage: function (lang) {
                try {
                    localStorage.setItem('bg_campaign_planner_lang', lang);
                } catch (e) {}
            },
            getBrowserLanguage: function () {
                return navigator.language || navigator.userLanguage || '';
            }
        };
    </script>
</body>

</html>
